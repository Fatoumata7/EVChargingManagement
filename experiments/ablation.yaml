# Étude d'ablation : les 4 configurations de l'échelle, sur la grille du rapport.
#
#   python -m src.pipeline.cli run --config experiments/ablation.yaml
#   python -m src.pipeline.cli ablation --latest
#
# Chaque barreau n'ajoute qu'un composant au précédent, sur le *même* monde
# (même graine, même grille, même flotte, mêmes tirages de comportement) :
# l'écart entre deux barreaux consécutifs est la contribution du composant.
label: ablation
seed: 42
scenarios: [optimistic, balance, pessimistic]
fleet_sizes: [50, 100, 150, 200, 250]
methods: [ablation]        # greedy -> multistation -> multistation_rep -> bramev

total_time: 1440          # 5 jours en slots de 5 min
nb_stations: 40
nb_societies: 4
strategy_noise: 0.5

save_latency: true
save_tables: true
figures: true
