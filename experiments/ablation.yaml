# Ablation study: the 4 rungs of the ladder + the 3 reference baselines.
#
#   python -m src.pipeline.cli run --config experiments/ablation.yaml
#   python -m src.pipeline.cli ablation --latest
#
# Two questions, one campaign — both are read on the *same* world (same seed,
# same grid, same fleet, same behaviour draws):
#
#   Ladder (`ablation`) — each rung adds exactly one component to the previous
#   one, so the gap between two consecutive rungs *is* the contribution of that
#   component:
#       greedy -> multistation -> multistation_rep -> bramev
#
#   Baselines (`baselines`) — pure choice policies, compared against BRAM-EV.
#   They share the protocol of `multistation` (broadcast to the stations within
#   the search radius, no reputation and no adaptation) and differ from it only
#   by the offer selection rule. At identical information scope, the measured
#   gap is therefore attributable to the rule alone:
#       min_waiting      offer with the lowest waiting time
#       load_aware       offer of the least loaded upcoming station
#       random_feasible  offer drawn at random among the offers received
#
# `greedy` (a single station contacted) remains the floor of the ladder and
# doubles as the single-station baseline: the `ablation` group already includes
# it.
label: ablation
seed: 42
scenarios: [optimistic, balance, pessimistic]
fleet_sizes: [50, 100, 150, 200, 250]
methods: [ablation, baselines]

total_time: 1440          # 5 days in 5 min slots
nb_stations: 40
nb_societies: 4
strategy_noise: 0.5

save_latency: true
save_tables: true
figures: true
