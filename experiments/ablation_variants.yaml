# BRAM-EV variants: one internal mechanism replaced, everything else unchanged.
#
#   python -m src.pipeline.cli run --config experiments/ablation_variants.yaml
#   python -m src.pipeline.cli ablation --latest
#
# `bramev` is included: it is the reference each variant compares against.
#   bramev_nearest_offer  nearest offer instead of the multi-criteria utility
#   bramev_fixed_alpha    same alpha for every station (alpha_fixed)
#   bramev_global_rep     global reputation instead of a per-company reputation
#   bramev_event_score    flat penalty instead of a duration-weighted one
label: ablation-variants
seed: 42
scenarios: [optimistic, balance, pessimistic]
fleet_sizes: [50, 100, 150, 200, 250]

# The `variants` group expands to the four variants;
# `bramev` is the reference they compare against.
methods: [bramev, variants]
alpha_fixed: 0.5           # common alpha imposed on bramev_fixed_alpha

total_time: 1440
nb_stations: 40
nb_societies: 4
strategy_noise: 0.5

save_latency: true
save_tables: true
figures: true
