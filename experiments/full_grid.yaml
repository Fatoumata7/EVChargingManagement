# Published grid of the report: 3 scenarios x 3 fleets x 6 methods, 5 days.
#
#   python -m src.pipeline.cli run --config experiments/full_grid.yaml
#
# Every CLI option overrides this file:
#   python -m src.pipeline.cli run --config experiments/full_grid.yaml --seed 7
#
# `seed: 42` is one replicate. Replace it with `seeds: [42, 7, 13]` (or pass
# --seeds) to run the plan once per seed: the ablation then aggregates over
# them and `share_improved` becomes a frequency instead of a sign. Cost is
# linear in the number of seeds.
label: full-grid
seed: 42
scenarios: [optimistic, balance, pessimistic]
fleet_sizes: [50, 150, 250]
# The `reference` group expands to BRAM-EV, the four baselines and greedy:
# this is the published comparison.
methods: [reference]

total_time: 1440          # 5 days in 5 min slots
nb_stations: 40
nb_societies: 4
strategy_noise: 0.5

save_latency: true
save_tables: true
figures: true
